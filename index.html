<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Download</title>
  <meta name="description" content="Download the latest installer release.">
  <meta name="theme-color" content="#060708">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="download-page">
    <section class="download-card" aria-labelledby="download-title">
      <p class="release-status"><span class="status-light" aria-hidden="true"></span>Current release</p>
      <div class="download-mark" aria-hidden="true">↓</div>
      <h1 id="download-title">Download ready</h1>
      <p class="intro">The latest installer is ready to save.</p>
      <a class="download-button" id="download-link" href="https://github.com/GateRiverMoat/installer-download/releases/latest/download/Installer.zip" download><span aria-hidden="true">↓</span><span>Download</span><span aria-hidden="true">→</span></a>
      <dl class="meta-grid">
        <div><dt>File</dt><dd>Installer.zip</dd></div>
        <div><dt>Size</dt><dd>168.70 MB</dd></div>
      </dl>
      <ol class="steps" aria-label="Installation steps">
        <li><span>1</span><p>Download the archive</p></li>
        <li><span>2</span><p>Extract the archive</p></li>
        <li><span>3</span><p>Run the installer</p></li>
      </ol>
    </section>
  </main>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('download-link').click();
    });
  </script>
</body>
</html>
